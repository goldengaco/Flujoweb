<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico del Sistema — TV Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#060d1b;--bg2:#0c1528;--bg3:#111c35;
      --cyan:#00e5ff;--teal:#00d4aa;
      --green:#00ff88;--green2:#2dffb0;
      --red:#ff4060;
      --gray:#1a2844;--gray2:#253658;--gray3:#3e5280;--gray4:#6b82aa;--gray5:#8fa4c8;
      --white:#e4ecff;
      --font:'Inter',system-ui,sans-serif;
    }
    html{font-size:16px}
    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--white);font-family:var(--font);
      display:flex;flex-direction:column;align-items:center;
      overflow-x:hidden;
    }

    /* ── BG ───────────────────────────────── */
    .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .scene__grad{
      position:absolute;inset:0;
      background:radial-gradient(ellipse 65% 45% at 50% 35%,rgba(0,180,216,.035) 0%,transparent 100%);
    }

    /* ── LAYOUT ──────────────────────────── */
    .hub{
      position:relative;z-index:2;width:100%;max-width:860px;
      padding:clamp(28px, 5vw, 56px) clamp(12px, 3vw, 24px) clamp(24px, 4vw, 40px);
      display:flex;flex-direction:column;align-items:center;gap:36px;
    }

    /* ── HEADER — Netflix style ──────────── */
    .hdr{text-align:center;max-width:640px}

    .hdr__pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 18px;border-radius:20px;
      background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.12);
      font-size:clamp(0.62rem, 1.4vw, 0.75rem);font-weight:600;letter-spacing:.1em;text-transform:uppercase;
      color:var(--cyan);margin-bottom:16px;
      transition:all .5s;
    }
    .hdr__pill .pip{
      width:6px;height:6px;border-radius:50%;
      background:var(--cyan);box-shadow:0 0 6px var(--cyan);
      animation:pip 2s ease-in-out infinite;
    }
    @keyframes pip{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
    .hdr__pill[data-s="done"]{background:rgba(0,255,136,.05);border-color:rgba(0,255,136,.18);color:var(--green)}
    .hdr__pill[data-s="done"] .pip{background:var(--green);box-shadow:0 0 6px var(--green);animation:none}
    .hdr__pill[data-s="error"]{background:rgba(255,64,96,.05);border-color:rgba(255,64,96,.18);color:var(--red)}
    .hdr__pill[data-s="error"] .pip{background:var(--red);box-shadow:0 0 6px var(--red);animation:none}

    .hdr__title{
      font-size:clamp(1.4rem, 4vw, 2.6rem);
      font-weight:800;letter-spacing:-.03em;line-height:1.15;
      color:var(--white);
    }
    .hdr__sub{
      margin-top:8px;font-size:clamp(0.8rem, 1.8vw, 0.95rem);color:var(--gray5);font-weight:400;
      line-height:1.5;
    }
    .hdr__status{
      margin-top:12px;font-size:clamp(0.75rem, 1.6vw, 0.88rem);font-weight:600;
      color:var(--green);opacity:0;
      transition:opacity .5s;
    }
    .hdr__status[data-visible="1"]{opacity:1}

    /* ── STEPPER ─────────────────────────── */
    .stepper{
      width:100%;display:flex;align-items:flex-start;
      justify-content:space-between;position:relative;
      padding:8px 0;
    }

    /* Track — thin, subtle, fades when done */
    .track{position:absolute;top:calc(clamp(66px, 14vw, 112px) / 2);left:calc(clamp(66px, 14vw, 112px) / 2);right:calc(clamp(66px, 14vw, 112px) / 2);height:2px;z-index:1}
    .track__bg{
      position:absolute;inset:0;border-radius:2px;
      background:var(--gray);opacity:.5;
    }
    .track__fill{
      position:absolute;top:-1px;left:0;bottom:-1px;
      width:0%;border-radius:2px;
      background:linear-gradient(90deg,rgba(0,255,136,.55),rgba(0,212,170,.45));
      transition:width 1.1s cubic-bezier(.22,1,.36,1),opacity 1s ease .3s,filter .8s ease .3s;
      box-shadow:0 0 8px rgba(0,255,136,.25);
    }
    /* When all done: track fades almost invisible */
    .track__fill[data-done="1"]{
      opacity:.12;
      box-shadow:none;
      filter:blur(1px);
    }
    /* Energy head while flowing */
    .track__fill::after{
      content:'';position:absolute;right:-2px;top:50%;transform:translateY(-50%);
      width:18px;height:8px;
      background:radial-gradient(ellipse,rgba(255,255,255,.7) 0%,rgba(0,255,136,.35) 50%,transparent 75%);
      border-radius:50%;opacity:0;transition:opacity .3s;
    }
    .track__fill[data-f="1"]::after{
      opacity:1;animation:ehead .9s ease-in-out infinite;
    }
    @keyframes ehead{
      0%,100%{transform:translateY(-50%) scaleX(1);opacity:.5}
      50%{transform:translateY(-50%) scaleX(1.4);opacity:1}
    }

    /* ── NODE ────────────────────────────── */
    .node{
      display:flex;flex-direction:column;align-items:center;
      gap:14px;position:relative;z-index:2;flex:1;cursor:default;
    }

    /* Ambient glow behind node */
    .node__glow{
      position:absolute;top:-4px;left:50%;transform:translateX(-50%);
      width:clamp(78px, 16vw, 130px);height:clamp(78px, 16vw, 130px);border-radius:50%;
      pointer-events:none;opacity:0;transition:opacity .7s,transform .7s;
    }
    .node[data-s="active"] .node__glow{
      opacity:1;
      background:radial-gradient(circle,rgba(0,229,255,.12) 0%,transparent 60%);
      animation:gpulse 2.2s ease-in-out infinite;
    }
    .node[data-s="done"] .node__glow{
      opacity:1;transform:translateX(-50%) scale(1);
      background:radial-gradient(circle,rgba(0,255,136,.18) 0%,transparent 55%);
    }
    .node[data-s="error"] .node__glow{
      opacity:1;
      background:radial-gradient(circle,rgba(255,64,96,.15) 0%,transparent 55%);
    }
    @keyframes gpulse{
      0%,100%{transform:translateX(-50%) scale(.88);opacity:.4}
      50%{transform:translateX(-50%) scale(1.1);opacity:1}
    }

    /* Circle — Netflix-sized, clean */
    .node__circle{
      width:clamp(66px, 14vw, 112px);height:clamp(66px, 14vw, 112px);border-radius:50%;position:relative;
      display:flex;align-items:center;justify-content:center;
      transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    .node:hover .node__circle{transform:scale(1.04)}

    /* Circle background */
    .node__bg{
      position:absolute;inset:0;border-radius:50%;
      background:linear-gradient(150deg,rgba(14,24,48,.9) 0%,rgba(8,16,35,.95) 100%);
      border:2.5px solid var(--gray2);
      transition:border-color .6s,box-shadow .7s,background .6s;
    }
    .node[data-s="active"] .node__bg{
      border-color:var(--cyan);
      box-shadow:0 0 18px rgba(0,229,255,.2),inset 0 0 14px rgba(0,229,255,.04);
    }
    .node[data-s="done"] .node__bg{
      border-color:var(--green);
      background:linear-gradient(150deg,rgba(0,60,35,.2) 0%,rgba(0,30,18,.25) 100%);
      box-shadow:
        0 0 22px rgba(0,255,136,.3),
        0 0 50px rgba(0,255,136,.08),
        inset 0 0 18px rgba(0,255,136,.06);
    }
    .node[data-s="error"] .node__bg{
      border-color:var(--red);
      background:linear-gradient(150deg,rgba(60,10,18,.25) 0%,rgba(30,5,10,.25) 100%);
      box-shadow:0 0 20px rgba(255,64,96,.25),inset 0 0 12px rgba(255,64,96,.04);
    }

    /* Spinner ring */
    .node__spin{
      position:absolute;inset:-6px;border-radius:50%;
      border:2px solid transparent;
      border-top-color:var(--cyan);border-right-color:rgba(0,229,255,.15);
      opacity:0;transition:opacity .4s;
    }
    .node[data-s="active"] .node__spin{
      opacity:1;animation:spin 1.6s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* EMOJI — always visible */
    .node__emoji{
      position:relative;z-index:2;
      font-size:clamp(1.5rem, 3.5vw, 2.6rem);line-height:1;
      transition:filter .7s,transform .5s;
      filter:saturate(.5) brightness(.6);
    }
    .node[data-s="active"] .node__emoji{
      filter:saturate(1) brightness(1);
      animation:efloat 2.8s ease-in-out infinite;
    }
    .node[data-s="done"] .node__emoji{
      filter:saturate(1.1) brightness(1.15)
        drop-shadow(0 0 8px rgba(0,255,136,.55))
        drop-shadow(0 0 20px rgba(0,255,136,.2));
      transform:scale(1.05);
    }
    .node[data-s="error"] .node__emoji{
      filter:saturate(1) brightness(1) drop-shadow(0 0 8px rgba(255,64,96,.45));
    }
    @keyframes efloat{
      0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}
    }

    /* Label */
    .node__label{
      font-size:clamp(0.68rem, 1.6vw, 0.85rem);font-weight:600;text-align:center;
      color:var(--gray4);transition:color .5s,text-shadow .5s;
      max-width:clamp(70px, 18vw, 125px);line-height:1.3;
    }
    .node[data-s="active"] .node__label{color:var(--cyan)}
    .node[data-s="done"] .node__label{
      color:var(--green2);text-shadow:0 0 10px rgba(0,255,136,.2);
    }
    .node[data-s="error"] .node__label{color:var(--red)}

    /* Metric */
    .node__metric{
      font-size:clamp(0.65rem, 1.4vw, 0.78rem);font-weight:600;
      font-family:'Cascadia Code','Fira Code',monospace;
      color:transparent;min-height:1.2em;
      transition:color .5s,text-shadow .5s;
    }
    .node[data-s="done"] .node__metric{
      color:var(--green);text-shadow:0 0 8px rgba(0,255,136,.3);
    }
    .node[data-s="active"] .node__metric{
      color:var(--cyan);text-shadow:0 0 6px rgba(0,229,255,.25);
    }
    .node[data-s="error"] .node__metric{color:var(--red)}

    /* ── BUTTONS — Netflix style ─────────── */
    .btn-group{
      display:flex;flex-direction:column;align-items:center;gap:12px;
    }

    .btn-primary{
      position:relative;padding:clamp(12px, 2.5vw, 16px) clamp(36px, 6vw, 56px);
      font-size:clamp(0.85rem, 2vw, 0.98rem);font-weight:700;letter-spacing:.04em;
      color:var(--bg);
      background:linear-gradient(135deg,var(--green) 0%,var(--teal) 100%);
      border:none;border-radius:50px;cursor:pointer;font-family:var(--font);
      box-shadow:0 4px 20px rgba(0,255,136,.25);
      transition:transform .25s,box-shadow .35s;overflow:hidden;
    }
    .btn-primary:hover{
      transform:translateY(-2px) scale(1.03);
      box-shadow:0 6px 30px rgba(0,255,136,.35);
    }
    .btn-primary:active{transform:scale(.97)}
    .btn-primary:disabled{opacity:.3;cursor:not-allowed;transform:none!important;box-shadow:none}
    .btn-primary::before{
      content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
      transform:skewX(-20deg);transition:left .5s;
    }
    .btn-primary:hover::before{left:130%}

    .btn-secondary{
      padding:10px 32px;
      font-size:clamp(0.72rem, 1.5vw, 0.82rem);font-weight:600;letter-spacing:.03em;
      color:var(--gray5);
      background:transparent;
      border:1.5px solid var(--gray2);border-radius:50px;
      cursor:pointer;font-family:var(--font);
      transition:border-color .3s,color .3s;
      display:none;
    }
    .btn-secondary:hover{border-color:var(--gray4);color:var(--white)}
    .btn-secondary[data-show="1"]{display:inline-block}

    /* ── LOGS ────────────────────────────── */
    .logs{
      width:100%;border-radius:14px;overflow:hidden;
      background:rgba(8,14,30,.75);border:1px solid rgba(255,255,255,.04);
      backdrop-filter:blur(8px);
    }
    .logs__head{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 20px;cursor:pointer;user-select:none;transition:background .2s;
    }
    .logs__head:hover{background:rgba(255,255,255,.02)}
    .logs__title{
      font-size:clamp(0.7rem, 1.5vw, 0.82rem);font-weight:600;letter-spacing:.06em;
      color:var(--gray5);display:flex;align-items:center;gap:10px;
    }
    .logs__badge{
      background:var(--green);color:var(--bg);
      font-size:.58rem;font-weight:800;padding:2px 8px;border-radius:10px;
      min-width:20px;text-align:center;
    }
    .logs__chev{
      font-size:.75rem;color:var(--gray3);
      transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    .logs[data-open="true"] .logs__chev{transform:rotate(180deg)}
    .logs__body{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1)}
    .logs[data-open="true"] .logs__body{max-height:360px}

    .log-list{
      list-style:none;padding:2px 20px 16px;max-height:310px;overflow-y:auto;
      display:flex;flex-direction:column;gap:2px;
    }
    .log-list::-webkit-scrollbar{width:4px}
    .log-list::-webkit-scrollbar-track{background:transparent}
    .log-list::-webkit-scrollbar-thumb{background:var(--gray);border-radius:10px}

    .le{
      display:flex;align-items:center;gap:10px;
      font-size:.73rem;line-height:1.6;padding:4px 8px;border-radius:6px;
      animation:lsin .3s ease-out;
    }
    .le:hover{background:rgba(255,255,255,.015)}
    @keyframes lsin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    .le__ts{
      color:var(--gray3);white-space:nowrap;
      font-family:'Cascadia Code','Fira Code',monospace;font-size:.66rem;min-width:80px;
    }
    .le__ico{font-size:.8rem;flex-shrink:0}
    .le__msg{color:var(--gray5)}
    .le__msg b{color:var(--white);font-weight:600}
    .le__msg .ok{color:var(--green)}
    .le__msg .err{color:var(--red)}

    /* ── RESPONSIVE ──────────────────────── */
    @media(max-width:640px){
      .hub{gap:28px}
      .node__spin{inset:-5px}
    }

    .footer{
      position:relative;z-index:1;margin-top:auto;padding:36px 0 18px;
      text-align:center;font-size:.65rem;color:var(--gray3);letter-spacing:.04em;
    }
  </style>
</head>
<body>

<div class="scene"><div class="scene__grad"></div></div>

<div class="hub">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr__pill" id="pill" data-s="">
      <span class="pip"></span>
      <span id="pillTxt">Diagnóstico de Red</span>
    </div>
    <h1 class="hdr__title" id="hdrT">Comprobando tu conexión</h1>
    <p class="hdr__sub" id="hdrS">Mientras se comprueba tu conexión, verificamos cada componente del sistema</p>
    <p class="hdr__status" id="hdrSt" data-visible="0"></p>
  </header>

  <!-- STEPPER -->
  <div class="stepper">
    <div class="track">
      <div class="track__bg"></div>
      <div class="track__fill" id="tf" data-f="0" data-done="0"></div>
    </div>

    <div class="node" data-s="pending" data-i="0">
      <div class="node__glow"></div>
      <div class="node__circle">
        <div class="node__bg"></div>
        <div class="node__spin"></div>
        <span class="node__emoji">🔌</span>
      </div>
      <span class="node__label">Conexión Local</span>
      <span class="node__metric" id="m0"></span>
    </div>

    <div class="node" data-s="pending" data-i="1">
      <div class="node__glow"></div>
      <div class="node__circle">
        <div class="node__bg"></div>
        <div class="node__spin"></div>
        <span class="node__emoji">📡</span>
      </div>
      <span class="node__label">Handshake API</span>
      <span class="node__metric" id="m1"></span>
    </div>

    <div class="node" data-s="pending" data-i="2">
      <div class="node__glow"></div>
      <div class="node__circle">
        <div class="node__bg"></div>
        <div class="node__spin"></div>
        <span class="node__emoji">🛡️</span>
      </div>
      <span class="node__label">Validación Auth</span>
      <span class="node__metric" id="m2"></span>
    </div>

    <div class="node" data-s="pending" data-i="3">
      <div class="node__glow"></div>
      <div class="node__circle">
        <div class="node__bg"></div>
        <div class="node__spin"></div>
        <span class="node__emoji">⚡</span>
      </div>
      <span class="node__label">Velocidad de Red</span>
      <span class="node__metric" id="m3"></span>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="btn-group">
    <button class="btn-primary" id="btnA" onclick="run()">¡Vamos a solucionarlo!</button>
    <button class="btn-secondary" id="btnB" data-show="0" onclick="restart()">Reiniciar diagnóstico</button>
  </div>

  <!-- LOGS -->
  <div class="logs" id="lp" data-open="false">
    <div class="logs__head" onclick="togLog()">
      <span class="logs__title">Registro de eventos <span class="logs__badge" id="lb">0</span></span>
      <span class="logs__chev">▴</span>
    </div>
    <div class="logs__body">
      <ul class="log-list" id="ll"></ul>
    </div>
  </div>

</div>

<footer class="footer">Depredador · Diagnostic Stepper v5.0</footer>

<script>
/* ── Config ──────────────────────────────── */
const EMOJIS = ['🔌','📡','🛡️','⚡'];
const CFG=[
  {label:'Conexión Local', dur:1500, met:'OK',     ok:'Conexión local estable',        fail:'Sin conexión local detectada'},
  {label:'Handshake API',  dur:1800, met:'200 OK', ok:'Handshake completado',           fail:'Error al conectar con Gateway'},
  {label:'Validación Auth',dur:2000, met:'JWT ✓',  ok:'Tokens válidos',                 fail:'Token de autenticación inválido'},
  {label:'Velocidad de Red',dur:2400,met:null,     ok:'Velocidad de Red — OK',          fail:'Latencia excesiva'}
];

let busy=false,si=-1,ln=0;
const $n=document.querySelectorAll('.node');
const $tf=document.getElementById('tf');
const $btnA=document.getElementById('btnA');
const $btnB=document.getElementById('btnB');
const $pill=document.getElementById('pill');
const $pTxt=document.getElementById('pillTxt');
const $hT=document.getElementById('hdrT');
const $hS=document.getElementById('hdrS');
const $hSt=document.getElementById('hdrSt');
const $ll=document.getElementById('ll');
const $lb=document.getElementById('lb');
const $lp=document.getElementById('lp');

const ts=()=>{const d=new Date();return d.toLocaleTimeString('es-MX',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0')};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const slp=ms=>new Promise(r=>setTimeout(r,ms));

function log(m,t='info',emoji=''){
  const li=document.createElement('li');li.className='le';
  li.innerHTML=`<span class="le__ts">${ts()}</span>${emoji?`<span class="le__ico">${emoji}</span>`:''}<span class="le__msg">${m}</span>`;
  $ll.prepend(li);ln++;$lb.textContent=ln;
}
function setS(i,s){$n[i].setAttribute('data-s',s)}
function setM(i,t){document.getElementById('m'+i).textContent=t}
function setTr(p,f){$tf.style.width=p+'%';$tf.setAttribute('data-f',f?'1':'0')}
function setTrDone(d){$tf.setAttribute('data-done',d?'1':'0')}
function setPill(t,s){$pTxt.textContent=t;$pill.setAttribute('data-s',s)}
function setStatus(t,show){$hSt.textContent=t;$hSt.setAttribute('data-visible',show?'1':'0')}

function reset(){
  si=-1;ln=0;$lb.textContent='0';$ll.innerHTML='';
  setTr(0,false);setTrDone(false);
  $n.forEach((_,i)=>{setS(i,'pending');setM(i,'')});
  setPill('Diagnóstico de Red','');
  $hT.textContent='Comprobando tu conexión';
  $hS.textContent='Mientras se comprueba tu conexión, verificamos cada componente del sistema';
  setStatus('',false);
  $btnA.textContent='¡Vamos a solucionarlo!';$btnA.disabled=false;
  $btnB.setAttribute('data-show','0');
}

function restart(){reset()}

async function run(){
  if(busy)return;
  if(si>=CFG.length){reset();await slp(300)}
  busy=true;$btnA.disabled=true;$btnA.textContent='Diagnosticando...';
  $btnB.setAttribute('data-show','0');
  setTrDone(false);setStatus('',false);
  setPill('Verificando sistema...','');
  log('Diagnóstico iniciado','info','🚀');
  if($lp.getAttribute('data-open')==='false')togLog();

  for(let i=0;i<CFG.length;i++){
    si=i;const c=CFG[i];
    setS(i,'active');
    log(`Verificando <b>${c.label}</b>...`,'info',EMOJIS[i]);
    setTr((i/(CFG.length-1))*100,true);

    if(i===CFG.length-1){
      const tgt=rnd(22,72);let cur=0;
      const iv=setInterval(()=>{cur+=rnd(1,4);if(cur>tgt)cur=tgt;setM(i,cur+' ms')},90);
      await slp(c.dur);clearInterval(iv);setM(i,tgt+' ms');c._v=tgt;
    }else{await slp(c.dur)}

    const fail=i===CFG.length-1?false:Math.random()<0.03;
    if(fail){
      setS(i,'error');setTr((i/(CFG.length-1))*100,false);
      log(`<span class="err">${c.fail}</span>`,'error',EMOJIS[i]);
      setPill('Error detectado','error');
      setStatus('Error en '+c.label+' — Revisa tu conexión',true);
      $hT.textContent='Problema detectado';
      $hS.textContent='Se encontró un error durante la verificación. Puedes reintentar.';
      $btnA.textContent='🔄 Reintentar';$btnA.disabled=false;
      $btnB.setAttribute('data-show','0');
      busy=false;return;
    }

    setS(i,'done');
    if(c.met)setM(i,c.met);
    const okText = i===CFG.length-1 
      ? `<span class="ok">${c.ok} — ${c._v} ms ✓</span>`
      : `<span class="ok">${c.ok} ✓</span>`;
    log(okText,'success',EMOJIS[i]);
    setTr(Math.min(((i+1)/(CFG.length-1))*100,100),i<CFG.length-1);
    await slp(350);
  }

  // All done — fade track
  setTr(100,false);
  await slp(500);
  setTrDone(true);

  log('<b>Diagnóstico completado con éxito</b>','success','🎉');
  setPill('Diagnóstico completado','done');
  setStatus('Diagnóstico completado — Conexión estable',true);
  $hT.textContent='Comprobando tu conexión';
  $hS.textContent='Todos los componentes pasaron la verificación exitosamente';
  $btnA.textContent='Diagnóstico completo';$btnA.disabled=true;
  $btnB.setAttribute('data-show','1');
  busy=false;
}

function togLog(){
  const o=$lp.getAttribute('data-open')==='true';
  $lp.setAttribute('data-open',String(!o));
}
</script>
