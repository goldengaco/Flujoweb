<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Diagnostic — Glassmorphism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-deep: #060e1e;
  --bg-mid: #0a1628;
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-bg-hover: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-border-strong: rgba(255, 255, 255, 0.18);
  --text-primary: #eaf0ff;
  --text-secondary: rgba(200, 215, 240, 0.65);
  --text-dim: rgba(160, 180, 210, 0.4);
  --cyan-active: #40e0f0;
  --cyan-glow: rgba(64, 224, 240, 0.35);
  --green-done: #3ee08a;
  --green-soft: rgba(62, 224, 138, 0.25);
  --green-glow-1: rgba(62, 224, 138, 0.15);
  --green-glow-2: rgba(62, 224, 138, 0.08);
  --red-error: #f05050;
  --red-glow: rgba(240, 80, 80, 0.3);
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

html {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px;
  color: var(--text-primary);
  background: var(--bg-deep);
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  overflow-x: hidden;
  position: relative;
}

/* ─── Bokeh Background ─── */
canvas#bokeh {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ─── Main Container ─── */
.main-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 780px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ─── Glass Panel Mixin ─── */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(28px) saturate(1.3);
  -webkit-backdrop-filter: blur(28px) saturate(1.3);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
}

/* ─── Header ─── */
.header {
  text-align: center;
  padding: 32px 28px 28px;
}

.header h1 {
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #eaf0ff 30%, rgba(64, 224, 240, 0.7));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header p {
  font-size: 0.88rem;
  color: var(--text-secondary);
  font-weight: 400;
  line-height: 1.5;
}

/* ─── Status Pill ─── */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 18px;
  border-radius: 100px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 16px;
  transition: all 0.5s ease;
}

.status-pill .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: all 0.5s ease;
}

.status-pill.running .dot {
  background: var(--cyan-active);
  box-shadow: 0 0 8px var(--cyan-glow);
  animation: dotPulse 1.2s ease-in-out infinite;
}

.status-pill.done .dot {
  background: var(--green-done);
  box-shadow: 0 0 8px var(--green-soft);
}

.status-pill.error .dot {
  background: var(--red-error);
  box-shadow: 0 0 8px var(--red-glow);
}

@keyframes dotPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.75); }
}

/* ─── Stepper Panel ─── */
.stepper-panel {
  padding: 40px 24px 36px;
}

/* ─── Stepper Track ─── */
.stepper {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  position: relative;
  padding: 0 8px;
}

/* Track behind nodes */
.track-container {
  position: absolute;
  top: 46px;
  left: 54px;
  right: 54px;
  height: 4px;
  border-radius: 4px;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
  z-index: 0;
}

.track-fill {
  height: 100%;
  width: 0%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--green-done), rgba(62, 224, 138, 0.5));
  box-shadow: 0 0 12px var(--green-glow-1), 0 0 4px var(--green-done);
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.track-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: -3px;
  width: 24px;
  height: 10px;
  border-radius: 10px;
  background: radial-gradient(ellipse at right, rgba(62, 224, 138, 0.5), transparent);
  filter: blur(3px);
  opacity: 0;
  transition: opacity 0.4s ease;
}

.track-fill.flowing::after {
  opacity: 1;
  animation: trackGlow 1.2s ease-in-out infinite;
}

@keyframes trackGlow {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* ─── Step Node ─── */
.step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  width: 100px;
}

.node-wrapper {
  position: relative;
  width: 92px;
  height: 92px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Radial glow behind circle (for completed) */
.node-glow {
  position: absolute;
  inset: -18px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--green-glow-1), transparent 70%);
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
}

.step.done .node-glow {
  opacity: 1;
}

.step.error .node-glow {
  background: radial-gradient(circle, var(--red-glow), transparent 70%);
  opacity: 1;
}

/* Glass circle */
.node-circle {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 2;
}

.step.pending .node-circle {
  opacity: 0.55;
}

.step.active .node-circle {
  border-color: var(--cyan-active);
  box-shadow:
    0 0 16px var(--cyan-glow),
    0 0 40px rgba(64, 224, 240, 0.1),
    inset 0 0 16px rgba(64, 224, 240, 0.06);
  background: rgba(64, 224, 240, 0.05);
  opacity: 1;
}

.step.done .node-circle {
  border-color: rgba(62, 224, 138, 0.5);
  background: rgba(62, 224, 138, 0.07);
  box-shadow:
    0 0 20px var(--green-glow-1),
    0 0 50px var(--green-glow-2),
    inset 0 0 20px rgba(62, 224, 138, 0.06);
  opacity: 1;
}

.step.error .node-circle {
  border-color: rgba(240, 80, 80, 0.5);
  background: rgba(240, 80, 80, 0.07);
  box-shadow:
    0 0 20px var(--red-glow),
    inset 0 0 16px rgba(240, 80, 80, 0.06);
  opacity: 1;
}

/* Spinning ring for active */
.spin-ring {
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--cyan-active);
  border-right-color: rgba(64, 224, 240, 0.3);
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 3;
  pointer-events: none;
}

.step.active .spin-ring {
  opacity: 1;
  animation: spinRing 1.1s linear infinite;
}

@keyframes spinRing {
  to { transform: rotate(360deg); }
}

/* Pulse ring for active */
.pulse-ring {
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 1px solid var(--cyan-active);
  opacity: 0;
  z-index: 1;
  pointer-events: none;
}

.step.active .pulse-ring {
  animation: pulseOut 2s ease-out infinite;
}

@keyframes pulseOut {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(1.45); opacity: 0; }
}

/* Emoji */
.node-emoji {
  font-size: 2rem;
  line-height: 1;
  transition: filter 0.6s ease, transform 0.4s ease;
  position: relative;
  z-index: 4;
  user-select: none;
}

.step.pending .node-emoji {
  filter: brightness(0.5) saturate(0.4);
}

.step.active .node-emoji {
  filter: brightness(1.1) drop-shadow(0 0 6px var(--cyan-glow));
  animation: emojiFloat 2s ease-in-out infinite;
}

.step.done .node-emoji {
  filter: brightness(1.15) drop-shadow(0 0 8px rgba(62, 224, 138, 0.5)) drop-shadow(0 0 16px rgba(62, 224, 138, 0.2));
}

.step.error .node-emoji {
  filter: brightness(1) drop-shadow(0 0 6px var(--red-glow));
}

@keyframes emojiFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* Label */
.step-label {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-dim);
  text-align: center;
  line-height: 1.35;
  transition: color 0.5s ease;
  max-width: 100px;
}

.step.active .step-label {
  color: var(--cyan-active);
}

.step.done .step-label {
  color: var(--green-done);
}

.step.error .step-label {
  color: var(--red-error);
}

/* Live counter */
.live-counter {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--cyan-active);
  font-variant-numeric: tabular-nums;
  min-height: 18px;
  opacity: 0;
  transition: opacity 0.3s ease;
  text-shadow: 0 0 10px var(--cyan-glow);
}

.live-counter.visible {
  opacity: 1;
}

/* ─── Action Button ─── */
.action-area {
  display: flex;
  justify-content: center;
}

.action-btn {
  appearance: none;
  border: 1px solid rgba(62, 224, 138, 0.25);
  border-radius: 100px;
  padding: 16px 44px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(135deg, rgba(62, 224, 138, 0.12), rgba(62, 224, 138, 0.04));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.35s ease;
  position: relative;
  overflow: hidden;
  letter-spacing: -0.01em;
}

.action-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(62, 224, 138, 0.2), transparent);
  opacity: 0;
  transition: opacity 0.35s ease;
}

.action-btn:hover:not(:disabled) {
  border-color: rgba(62, 224, 138, 0.45);
  box-shadow: 0 0 30px rgba(62, 224, 138, 0.12), 0 4px 20px rgba(0,0,0,0.3);
  transform: translateY(-1px);
}

.action-btn:hover:not(:disabled)::before {
  opacity: 1;
}

.action-btn:active:not(:disabled) {
  transform: translateY(0);
}

.action-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.action-btn .btn-text {
  position: relative;
  z-index: 1;
}

/* ─── Log Panel ─── */
.log-panel {
  overflow: hidden;
  transition: all 0.4s ease;
}

.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s ease;
}

.log-header:hover {
  background: var(--glass-bg-hover);
}

.log-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.log-header-left span {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.log-icon {
  font-size: 0.85rem;
}

.log-chevron {
  font-size: 0.75rem;
  color: var(--text-dim);
  transition: transform 0.3s ease;
}

.log-panel.open .log-chevron {
  transform: rotate(180deg);
}

.log-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.log-panel.open .log-body {
  max-height: 300px;
}

.log-content {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 240px;
  overflow-y: auto;
}

.log-content::-webkit-scrollbar {
  width: 4px;
}

.log-content::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
}

.log-entry {
  font-size: 0.73rem;
  font-family: 'Inter', monospace;
  color: var(--text-secondary);
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  display: flex;
  gap: 10px;
  animation: logFadeIn 0.3s ease;
}

.log-entry .log-time {
  color: var(--text-dim);
  font-weight: 500;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.log-entry.success {
  color: var(--green-done);
}

.log-entry.error {
  color: var(--red-error);
}

.log-entry.info {
  color: var(--cyan-active);
}

@keyframes logFadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.log-badge {
  background: rgba(255,255,255,0.06);
  border-radius: 100px;
  padding: 2px 10px;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* ─── Responsive ─── */
@media (max-width: 600px) {
  .main-container {
    gap: 20px;
  }

  .header {
    padding: 24px 20px 22px;
  }

  .header h1 {
    font-size: 1.35rem;
  }

  .stepper-panel {
    padding: 30px 12px 28px;
  }

  .step {
    width: 70px;
  }

  .node-wrapper {
    width: 68px;
    height: 68px;
  }

  .node-circle {
    width: 62px;
    height: 62px;
  }

  .node-emoji {
    font-size: 1.55rem;
  }

  .step-label {
    font-size: 0.62rem;
    max-width: 72px;
  }

  .track-container {
    top: 34px;
    left: 38px;
    right: 38px;
  }

  .action-btn {
    padding: 14px 36px;
    font-size: 0.88rem;
  }

  .live-counter {
    font-size: 0.62rem;
  }
}

@media (max-width: 400px) {
  .step {
    width: 60px;
  }

  .node-wrapper {
    width: 58px;
    height: 58px;
  }

  .node-circle {
    width: 52px;
    height: 52px;
  }

  .node-emoji {
    font-size: 1.3rem;
  }

  .step-label {
    font-size: 0.58rem;
    max-width: 62px;
  }

  .track-container {
    top: 30px;
    left: 32px;
    right: 32px;
  }
}

/* ─── Completion Celebration ─── */
@keyframes completePop {
  0% { transform: scale(1); }
  30% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

.step.just-done .node-circle {
  animation: completePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
</style>
</head>
<body>

<canvas id="bokeh"></canvas>

<div class="main-container">

  <!-- Header -->
  <div class="header glass">
    <div class="status-pill" id="statusPill">
      <span class="dot"></span>
      <span id="statusText">Esperando inicio</span>
    </div>
    <h1>Diagnóstico de Señal TV</h1>
    <p>Verificación integral de conectividad, autenticación y rendimiento de red</p>
  </div>

  <!-- Stepper -->
  <div class="stepper-panel glass">
    <div class="stepper" id="stepper">
      <div class="track-container">
        <div class="track-fill" id="trackFill"></div>
      </div>

      <div class="step pending" id="step-0" data-index="0">
        <div class="node-wrapper">
          <div class="node-glow"></div>
          <div class="node-circle">
            <div class="spin-ring"></div>
            <div class="pulse-ring"></div>
            <span class="node-emoji">🔌</span>
          </div>
        </div>
        <span class="step-label">Conexión Local</span>
        <span class="live-counter" id="counter-0"></span>
      </div>

      <div class="step pending" id="step-1" data-index="1">
        <div class="node-wrapper">
          <div class="node-glow"></div>
          <div class="node-circle">
            <div class="spin-ring"></div>
            <div class="pulse-ring"></div>
            <span class="node-emoji">📡</span>
          </div>
        </div>
        <span class="step-label">Handshake API</span>
        <span class="live-counter" id="counter-1"></span>
      </div>

      <div class="step pending" id="step-2" data-index="2">
        <div class="node-wrapper">
          <div class="node-glow"></div>
          <div class="node-circle">
            <div class="spin-ring"></div>
            <div class="pulse-ring"></div>
            <span class="node-emoji">🛡️</span>
          </div>
        </div>
        <span class="step-label">Validación Auth</span>
        <span class="live-counter" id="counter-2"></span>
      </div>

      <div class="step pending" id="step-3" data-index="3">
        <div class="node-wrapper">
          <div class="node-glow"></div>
          <div class="node-circle">
            <div class="spin-ring"></div>
            <div class="pulse-ring"></div>
            <span class="node-emoji">⚡</span>
          </div>
        </div>
        <span class="step-label">Velocidad de Red</span>
        <span class="live-counter" id="counter-3"></span>
      </div>

    </div>
  </div>

  <!-- Action Button -->
  <div class="action-area">
    <button class="action-btn" id="actionBtn" onclick="startDiagnostic()">
      <span class="btn-text">¡Vamos a solucionarlo!</span>
    </button>
  </div>

  <!-- Log Panel -->
  <div class="log-panel glass" id="logPanel">
    <div class="log-header" onclick="toggleLog()">
      <div class="log-header-left">
        <span class="log-icon">📋</span>
        <span>Registro de Eventos</span>
        <span class="log-badge" id="logBadge">0</span>
      </div>
      <span class="log-chevron">▼</span>
    </div>
    <div class="log-body">
      <div class="log-content" id="logContent"></div>
    </div>
  </div>

</div>

<script>
// ─── Bokeh Background ───
(function initBokeh() {
  const canvas = document.getElementById('bokeh');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const PARTICLE_COUNT = 28;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createParticle() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 60 + 15,
      vx: (Math.random() - 0.5) * 0.2,
      vy: (Math.random() - 0.5) * 0.15,
      opacity: Math.random() * 0.04 + 0.01,
      hue: Math.random() > 0.6 ? 160 + Math.random() * 40 : 210 + Math.random() * 30,
    };
  }

  function init() {
    resize();
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(createParticle());
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -p.r) p.x = canvas.width + p.r;
      if (p.x > canvas.width + p.r) p.x = -p.r;
      if (p.y < -p.r) p.y = canvas.height + p.r;
      if (p.y > canvas.height + p.r) p.y = -p.r;

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      grad.addColorStop(0, `hsla(${p.hue}, 70%, 55%, ${p.opacity * 1.5})`);
      grad.addColorStop(0.6, `hsla(${p.hue}, 60%, 40%, ${p.opacity * 0.5})`);
      grad.addColorStop(1, `hsla(${p.hue}, 50%, 30%, 0)`);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();

// ─── Diagnostic Logic ───
const STEPS = [
  { id: 0, name: 'Conexión Local', emoji: '🔌' },
  { id: 1, name: 'Handshake API', emoji: '📡' },
  { id: 2, name: 'Validación Auth', emoji: '🛡️' },
  { id: 3, name: 'Velocidad de Red', emoji: '⚡' },
];

let isRunning = false;
let logCount = 0;
let counterInterval = null;

function getTimestamp() {
  const now = new Date();
  return now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
}

function addLog(message, type = '') {
  const el = document.getElementById('logContent');
  const entry = document.createElement('div');
  entry.className = 'log-entry' + (type ? ' ' + type : '');
  entry.innerHTML = `<span class="log-time">${getTimestamp()}</span><span>${message}</span>`;
  el.appendChild(entry);
  el.scrollTop = el.scrollHeight;
  logCount++;
  document.getElementById('logBadge').textContent = logCount;
}

function setStatus(text, state) {
  const pill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  pill.className = 'status-pill' + (state ? ' ' + state : '');
  statusText.textContent = text;
}

function setStepState(index, state) {
  const step = document.getElementById(`step-${index}`);
  step.className = 'step ' + state;
  if (state === 'done') {
    step.classList.add('just-done');
    setTimeout(() => step.classList.remove('just-done'), 600);
  }
}

function setTrack(percent) {
  const fill = document.getElementById('trackFill');
  fill.style.width = percent + '%';
  if (percent > 0 && percent < 100) {
    fill.classList.add('flowing');
  } else {
    fill.classList.remove('flowing');
  }
}

function startLiveCounter(index) {
  const el = document.getElementById(`counter-${index}`);
  el.classList.add('visible');
  let ms = 0;
  const start = performance.now();
  counterInterval = setInterval(() => {
    ms = Math.round(performance.now() - start);
    el.textContent = ms + ' ms';
  }, 47);
}

function stopLiveCounter(index) {
  clearInterval(counterInterval);
  counterInterval = null;
  const el = document.getElementById(`counter-${index}`);
  // keep final value visible
}

function randomDelay() {
  return 1500 + Math.random() * 1000; // 1.5-2.5s
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function toggleLog() {
  document.getElementById('logPanel').classList.toggle('open');
}

async function runStep(index) {
  const step = STEPS[index];
  const isLast = index === STEPS.length - 1;

  setStepState(index, 'active');
  addLog(`${step.emoji} Iniciando: ${step.name}…`, 'info');

  if (isLast) {
    startLiveCounter(index);
  }

  await sleep(randomDelay());

  if (isLast) {
    stopLiveCounter(index);
  }

  setStepState(index, 'done');
  const trackPercent = ((index + 1) / (STEPS.length - 1)) * 100;
  setTrack(Math.min(trackPercent, 100));
  addLog(`${step.emoji} ${step.name} — completado ✓`, 'success');
}

async function startDiagnostic() {
  if (isRunning) return;
  isRunning = true;

  const btn = document.getElementById('actionBtn');
  btn.disabled = true;
  btn.querySelector('.btn-text').textContent = 'Ejecutando diagnóstico…';

  // Reset
  logCount = 0;
  document.getElementById('logBadge').textContent = '0';
  document.getElementById('logContent').innerHTML = '';
  STEPS.forEach((_, i) => {
    setStepState(i, 'pending');
    const c = document.getElementById(`counter-${i}`);
    c.textContent = '';
    c.classList.remove('visible');
  });
  setTrack(0);

  // Open log
  document.getElementById('logPanel').classList.add('open');

  setStatus('Diagnóstico en curso', 'running');
  addLog('🚀 Diagnóstico iniciado', 'info');

  for (let i = 0; i < STEPS.length; i++) {
    await runStep(i);
    if (i < STEPS.length - 1) {
      await sleep(300);
    }
  }

  setStatus('Diagnóstico completado', 'done');
  addLog('🎉 Todos los sistemas verificados correctamente', 'success');

  btn.disabled = false;
  btn.querySelector('.btn-text').textContent = 'Ejecutar de nuevo';
  isRunning = false;
}
</script>
